name: Release

on:
  push:
    branches: [main]
    tags:
      - "*"
jobs:
  cuda:
    name: Push CUDA image to Docker
    runs-on: image-builder
    steps:
      - name: Remove unnecessary packages
        run: |
          echo "=== Before pruning ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          echo "=== After pruning ==="
          df -h

      # Link to discussion: https://github.com/orgs/community/discussions/25678

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Docker meta
        id: meta
        uses: crazy-max/ghaction-docker-meta@f02d9f4f9bdea946298d7cf0a0567c289af7bbda  # v2.5.0
        with:
          images: |
            primeintellect/prime-rl
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=commit-
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9  # v1.7.0

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7  # v1.14.1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a  # v2.10.0
        with:
          context: .
          file: ./Dockerfile.cuda
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Test import
        run: docker run --entrypoint python primeintellect/prime-rl:main -c "import prime_rl"

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
